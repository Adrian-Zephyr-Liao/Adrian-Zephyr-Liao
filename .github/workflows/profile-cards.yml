name: Refresh profile cards

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-cards.yml'
      - 'scripts/update-profile-cards.py'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh statistics
        run: python3 scripts/update-profile-cards.py
      - name: Commit updated cards
        run: |
          git add -- assets/github-stats.svg assets/github-languages.svg assets/github-contributions.svg assets/github-contributions-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh GitHub activity cards'
          git pull --rebase origin main
          git push origin HEAD:main
