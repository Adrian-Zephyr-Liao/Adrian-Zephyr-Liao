<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title description">
  <title id="title">Adrian Zephyr Liao</title>
  <desc id="description">Wenrun Liao, known as Jingzhao at Alibaba. Retail AI and agent engineering at Taobao Shangou. A compact layout with an orange orbital illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11151d"/>
      <stop offset="1" stop-color="#07090e"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#ff8a51" stop-opacity=".19"/>
      <stop offset=".5" stop-color="#f76036" stop-opacity=".07"/>
      <stop offset="1" stop-color="#f76036" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffba82" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff8251" stop-opacity=".06"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="720" height="600" rx="22"/></clipPath>
  </defs>
  <style>
    .display { font-family: 'Geist', 'Avenir Next', 'Segoe UI', sans-serif; font-weight: 650; letter-spacing: -3px; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .satellite { transform-origin: 600px 505px; animation: orbit 26s cubic-bezier(.45,.05,.55,.95) infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .satellite { animation: none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="720" height="600" fill="url(#background)"/>
    <circle cx="600" cy="505" r="220" fill="url(#halo)"/>
    <g fill="none" stroke="url(#orbit)" stroke-width="1.3">
      <circle cx="600" cy="505" r="116" stroke-opacity=".4"/>
      <ellipse cx="600" cy="505" rx="140" ry="53" transform="rotate(-32 600 505)"/>
      <ellipse cx="600" cy="505" rx="110" ry="78" transform="rotate(47 600 505)" stroke-opacity=".55"/>
    </g>
    <circle cx="600" cy="505" r="40" fill="#1c181b" stroke="#ffb080" stroke-opacity=".3"/>
    <text x="600" y="519" text-anchor="middle" class="display" font-size="36" fill="#ffcfb1">AZ</text>
    <g class="satellite">
      <circle cx="600" cy="389" r="4" fill="#ffb080"/>
      <circle cx="600" cy="389" r="10" fill="#ffb080" fill-opacity=".09"/>
    </g>
    <path d="M44 52h9v9h-9z" fill="#ff9a66"/>
    <text x="70" y="63" class="mono" font-size="21" letter-spacing="1.7" fill="#b3bdce">TAOBAO SHANGOU / ALIBABA</text>
    <text x="40" y="211" class="display" font-size="115" fill="#f3f5f8">ADRIAN</text>
    <text x="42" y="307" class="display" font-size="83" fill="#f3f5f8">ZEPHYR LIAO</text>
    <text x="46" y="370" class="mono" font-size="25" letter-spacing=".8" fill="#ffb68b">RETAIL AI / AGENT ENGINEERING</text>
    <path d="M44 416h632" stroke="#cbd5e9" stroke-opacity=".11"/>
    <text x="46" y="470" class="mono" font-size="22" letter-spacing="1" fill="#c2ccdc">WENRUN LIAO</text>
    <text x="46" y="509" class="mono" font-size="20" letter-spacing="1" fill="#9daabe">JINGZHAO @ ALIBABA</text>
    <text x="46" y="563" class="mono" font-size="18" letter-spacing=".5" fill="#9daabe">FRONTEND + DEVELOPER TOOLS</text>
  </g>
</svg>
