<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">Adrian Zephyr Liao</title>
  <desc id="description">Wenrun Liao, known as Jingzhao at Alibaba. Retail AI and agent engineering at Taobao Shangou. An orange orbital illustration accompanies the name on a dark background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11151d"/>
      <stop offset="1" stop-color="#07090e"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#ff8a51" stop-opacity=".19"/>
      <stop offset=".5" stop-color="#f76036" stop-opacity=".07"/>
      <stop offset="1" stop-color="#f76036" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffba82" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ff8251" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8251" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#29201e"/>
      <stop offset="1" stop-color="#11131b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#b8c1d2" fill-opacity=".1"/>
    </pattern>
    <clipPath id="canvas"><rect width="1280" height="440" rx="22"/></clipPath>
  </defs>
  <style>
    .display { font-family: 'Geist', 'Avenir Next', 'Segoe UI', sans-serif; font-weight: 650; letter-spacing: -3.5px; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .satellites { transform-origin: 1012px 208px; animation: orbit 26s cubic-bezier(.45,.05,.55,.95) infinite; }
    .signal { animation: signal 7s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes signal { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .satellites, .signal { animation: none; } }
  </style>
  <g clip-path="url(#canvas)">
    <rect width="1280" height="440" fill="url(#background)"/>
    <rect x="730" width="550" height="440" fill="url(#grid)"/>
    <circle cx="1012" cy="208" r="256" fill="url(#halo)"/>
    <path d="M765 42h33M781.5 25.5v33M1198 346h33M1214.5 329.5v33" stroke="#b4c1d6" stroke-opacity=".18" stroke-width="1"/>
    <g fill="none" stroke="#ffc09b">
      <circle cx="1012" cy="208" r="167" stroke-opacity=".1"/>
      <circle cx="1012" cy="208" r="135" stroke-opacity=".06" stroke-dasharray="2 10"/>
      <path d="M845 208h-30M1179 208h30M1012 41V22M1012 375v19" stroke-opacity=".2"/>
    </g>
    <g fill="none" stroke="url(#orbit)" stroke-width="1.4">
      <ellipse cx="1012" cy="208" rx="191" ry="72" transform="rotate(-32 1012 208)"/>
      <ellipse cx="1012" cy="208" rx="150" ry="104" transform="rotate(47 1012 208)" stroke-opacity=".6"/>
    </g>
    <path d="M897 297 943 208 1012 146 1081 208 1130 119" fill="none" stroke="#c4dce6" stroke-opacity=".21" stroke-width="1"/>
    <circle cx="1012" cy="208" r="61" fill="url(#core)" stroke="#ffb080" stroke-opacity=".35"/>
    <circle cx="1012" cy="208" r="48" fill="none" stroke="#ffc5a5" stroke-opacity=".07"/>
    <text x="1012" y="226" text-anchor="middle" class="display" font-size="49" fill="#ffcfb1" letter-spacing="-5">AZ</text>
    <g class="satellites">
      <circle cx="1012" cy="41" r="5" fill="#ffb080"/>
      <circle cx="1012" cy="41" r="11" fill="#ffb080" fill-opacity=".09"/>
      <circle cx="1012" cy="375" r="3.5" fill="#c4ece6"/>
      <circle cx="845" cy="208" r="3" fill="#ff8054"/>
    </g>
    <g class="signal">
      <circle cx="897" cy="297" r="3" fill="#f2b898"/>
      <circle cx="1130" cy="119" r="3" fill="#b8e0db"/>
    </g>
    <g class="mono" font-size="17" letter-spacing="2.1">
      <path d="M64 55h8v8h-8z" fill="#ff9a66"/>
      <text x="87" y="65" fill="#b3bdce">TAOBAO SHANGOU / ALIBABA</text>
    </g>
    <text x="60" y="177" class="display" font-size="103" fill="#f3f5f8">ADRIAN</text>
    <text x="62" y="270" class="display" font-size="86" fill="#f3f5f8">ZEPHYR LIAO</text>
    <text x="66" y="321" class="mono" font-size="19" letter-spacing="1.5" fill="#ffb68b">RETAIL AI / AGENT ENGINEERING</text>
    <path d="M64 371h1152" stroke="#cbd5e9" stroke-opacity=".11"/>
    <text x="65" y="406" class="mono" font-size="15" letter-spacing="1.6" fill="#9daabe">WENRUN LIAO · JINGZHAO</text>
    <text x="1216" y="406" text-anchor="end" class="mono" font-size="15" letter-spacing="1.6" fill="#9daabe">FRONTEND + DEVELOPER TOOLS</text>
  </g>
</svg>
